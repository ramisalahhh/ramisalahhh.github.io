<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 500" width="480" height="500" font-family="ui-monospace, Consolas, Menlo, monospace" font-size="15" fill="#1f2328">
  <title>DevOps command reference deployment</title>
